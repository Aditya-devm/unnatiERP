<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Neo-Campus Pulse: Leave Management</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Custom Colors -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'campus-dark': '#0f1115',
            'campus-modal': '#2c313c',
            'campus-input': '#2c313c',
            'campus-accent': '#f5b50a',
            'campus-border': '#4b5563',
            'campus-text-muted': '#9ca3af',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbar">
    /* Hide scrollbar for cleaner mobile look */
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style data-purpose="form-layout">
    /* Custom styles for overlapping labels in inputs */
    .field-container {
      position: relative;
    }
    .field-label {
      position: absolute;
      top: -10px;
      left: 12px;
      background-color: #2c313c; /* Matches campus-modal */
      padding: 0 4px;
      font-size: 0.75rem;
      color: #9ca3af;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-campus-dark text-white font-sans min-h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="sticky top-0 z-50 bg-campus-dark/80 backdrop-blur-md flex justify-between items-center w-full px-4 py-2 border-b border-white/10">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-campus-accent">
<img class="w-full h-full object-cover" alt="Pranay Singh" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAV2NXPmsX5GYWJvDNHB1M_JaqERJWzqa-Oer9-Ed_cNgcDD23pagdEJN_QJVErhYylTlXBXvu3rcPT_ViHAdPH2a4tyB7kfkRI6vi2wC7gNFell3qNuDaii0HDei-LmfwPfS7UCND4hjfAPQ7tA-m4JXNSrA0ZJfv-gggGzznbYkVMsl99vVeMoNYhpOuzdjxQKRAtdZ6yqMoA2WU6TUJhicfhLRs1kbr-tsF4OVNU0R1xKIoykB1heHFJlENB7qiZyw-L7et-NIGH">
</div>
<div>
<h1 class="text-lg font-bold text-white">Pranay Singh</h1>
<p class="text-[10px] text-campus-text-muted flex items-center gap-1">
                    Class 9 ICSE <span class="material-symbols-outlined text-[12px]">expand_more</span>
</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-white/5 rounded-full transition-colors relative">
<span class="material-symbols-outlined text-campus-accent">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-red-400 rounded-full border border-campus-dark"></span>
</button>
<button class="p-2 hover:bg-white/5 rounded-full transition-colors"><span class="material-symbols-outlined text-red-400">logout</span></button>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: ModalOverlay -->
<div class="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50" data-purpose="apply-leave-overlay">
<!-- BEGIN: LeaveFormCard -->
<div class="bg-campus-modal w-full max-w-md rounded-2xl overflow-hidden shadow-2xl" data-purpose="leave-form-container">
<!-- Header of the Card -->
<div class="flex justify-between items-center p-5 pb-2">
<h2 class="text-campus-accent text-lg font-bold">Apply for Leave</h2>
<button class="text-red-400">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<div class="px-5 pb-2">
<p class="text-gray-300 font-semibold mb-6">Pranay Singh</p>
</div>
<!-- Form Content -->
<form class="px-5 space-y-6" onsubmit="return false;">
<!-- Leave Type Dropdown -->
<div class="field-container">
<span class="field-label">Leave Type</span>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<!-- Coins/Icon -->
<svg class="h-6 w-6 text-gray-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 4.69 2 8s4.48 6 10 6 10-2.69 10-6-4.48-6-10-6zm0 10c-4.41 0-8-1.79-8-4s3.59-4 8-4 8 1.79 8 4-3.59 4-8 4zm0 2c-4.41 0-8 1.79-8 4s3.59 4 8 4 8-1.79 8-4-3.59-4-8-4zm0 4c-4.41 0-8 1.79-8 4s3.59 4 8 4 8-1.79 8-4-3.59-4-8-4z"></path>
</svg>
</div>
<select class="block w-full bg-transparent border border-campus-border rounded-xl py-4 pl-12 pr-10 text-white appearance-none focus:outline-none focus:ring-1 focus:ring-campus-accent">
<option selected="">Casual</option>
<option>Sick Leave</option>
<option>Emergency</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- From Date Picker -->
<div class="field-container">
<span class="field-label">From</span>
<div class="relative">
<input class="block w-full bg-transparent border border-campus-border rounded-xl py-4 px-4 text-white font-bold focus:outline-none focus:ring-1 focus:ring-campus-accent" type="text" value="25/07/2026">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<svg class="h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- To Date Picker -->
<div class="field-container">
<span class="field-label">To</span>
<div class="relative">
<input class="block w-full bg-transparent border border-campus-border rounded-xl py-4 px-4 text-white font-bold focus:outline-none focus:ring-1 focus:ring-campus-accent" type="text" value="25/07/2026">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<svg class="h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Reason Text Area -->
<div class="relative">
<div class="absolute top-4 left-3 pointer-events-none">
<!-- Reason Bookmark/Paper Icon -->
<svg class="h-6 w-6 text-gray-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"></path>
</svg>
</div>
<textarea class="block w-full bg-transparent border border-campus-border rounded-xl py-4 pl-12 pr-4 text-campus-text-muted focus:outline-none focus:ring-1 focus:ring-campus-accent resize-none placeholder:text-campus-text-muted" placeholder="Reason" rows="2"></textarea>
</div>
<!-- Save Button Area -->
<div class="pt-4 pb-6">
<button class="w-full bg-campus-accent text-campus-dark font-bold py-4 rounded-2xl shadow-lg hover:opacity-90 active:scale-95 transition-all" type="submit">
            Save
          </button>
</div>
</form>
</div>
<!-- END: LeaveFormCard -->
</div>
<!-- END: ModalOverlay -->
<!-- Floating Action Button (Background Layer) -->
<div class="fixed bottom-6 right-6 z-10 opacity-50">
<button class="bg-campus-accent p-4 rounded-2xl shadow-xl text-campus-dark">
<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</button>
</div>
<!-- iOS Bottom Indicator -->
<div class="mt-auto flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-600 rounded-full"></div>
</div>




</body></html>
